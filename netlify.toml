[build]
  # No base directory needed for static sites
  base = ""
  
  # Publish from root directory (where index.html is)
  publish = "."
  
  # No build command needed
  command = "echo 'Static site - no build needed'"

# Optional: Handle SPA-like routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Set headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"